version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "rimraf"
        versions: [">=6"]
      # openapi-typescript 7.x loads the TypeScript JS API at runtime, which TS 7 does not ship
      # (openapi-ts/openapi-typescript#2841). Lift once a release stops importing it.
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore(deps)"