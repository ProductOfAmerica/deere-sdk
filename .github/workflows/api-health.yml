name: API Health Check

on:
  schedule:
    # Run daily at 5 AM UTC (staggered from sync-api at 6 AM)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  check-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API availability
        id: check
        # Deliberately does NOT fail here. The badge steps below have to run on
        # an unhealthy result too: while this step failed the job outright, the
        # red branch of the badge logic was unreachable, so a broken API left
        # the badge silently displaying its last good value. The job is failed
        # at the end of this job instead, after the badge is written.
        run: |
          set +e
          npx tsx scripts/check-api-health.ts > health-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat health-report.json

      - name: Update health badge
        run: |
          TOTAL=$(jq '.total' health-report.json)
          HEALTHY=$(jq '.healthy' health-report.json)
          FROZEN=$(jq '.frozen' health-report.json)

          # Green only when every spec is fresh. Yellow when the only shortfall
          # is freezes recorded in scripts/spec-registry.yaml. Red when an
          # active spec is one this pipeline cannot consume. The old threshold
          # (green on all-healthy, yellow above an arbitrary 20, else red) had
          # no relationship to whether the sync could actually run.
          if [ "$HEALTHY" -eq "$TOTAL" ]; then
            echo "COLOR=brightgreen" >> $GITHUB_ENV
            echo "LABEL=$HEALTHY/$TOTAL APIs" >> $GITHUB_ENV
          elif [ "$((HEALTHY + FROZEN))" -eq "$TOTAL" ]; then
            echo "COLOR=yellow" >> $GITHUB_ENV
            echo "LABEL=$HEALTHY/$TOTAL APIs, $FROZEN frozen" >> $GITHUB_ENV
          else
            echo "COLOR=red" >> $GITHUB_ENV
            echo "LABEL=$HEALTHY/$TOTAL APIs" >> $GITHUB_ENV
          fi

      - name: Create health badge JSON
        run: |
          mkdir -p .github/badges
          echo '{
            "schemaVersion": 1,
            "label": "API Health",
            "message": "${{ env.LABEL }}",
            "color": "${{ env.COLOR }}"
          }' > .github/badges/api-health.json

      - name: Upload health artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-artifacts
          path: |
            .github/badges/api-health.json
            health-report.json
          retention-days: 1

      # Last in this job, so the badge and artifact above are already written
      # and a genuine outage still turns the run red.
      - name: Fail if an active spec is unusable
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::check-api-health exited ${{ steps.check.outputs.exit_code }}: an active" \
               "spec could not be fetched or did not validate. Either repoint its slug in" \
               "scripts/spec-registry.yaml, or freeze it there with a reason. Registry-frozen" \
               "specs are reported but never fail this check."
          exit 1

  commit-health-status:
    needs: check-apis
    # Runs even when check-apis failed, so an unhealthy result reaches the
    # badge instead of leaving the last healthy one on display.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: health-artifacts
          path: .

      - name: Commit health status
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/api-health.json health-report.json || true
          git diff --staged --quiet || git commit -m "chore: update API health status"
          git push || true
