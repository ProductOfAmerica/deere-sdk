# Spec registry — scripts/spec-registry.yaml
#
# The source of truth for WHICH specs the pipeline fetches, WHERE the portal
# currently serves them, and WHICH of them are knowingly not being refreshed.
# Consumed by scripts/lib/spec-registry.ts (loader + validation), and read by
# scripts/fetch-specs.ts and scripts/check-api-health.ts.
#
# Committed and hand-edited. Unlike scripts/api-surface.yaml, no generator
# rewrites this file, so comments here survive.
#
# ---------------------------------------------------------------------------
# Per-entry fields
# ---------------------------------------------------------------------------
#
#   <spec name>:            The INTERNAL name. Names specs/raw/<name>.yaml,
#                           specs/fixed/<name>.yaml, the generated *Api class,
#                           and the public `SpecName` literal a consumer passes
#                           to client.get(). Renaming one is a breaking change
#                           to the published type union, so it never tracks an
#                           upstream rename.
#
#     slug:                 The path segment the developer portal serves this
#                           spec under, i.e. the {slug} in
#                           https://developer.deere.com/devDoc/apiDetails/{slug}
#                           Deere renames these; when that happens the fetch
#                           fails loudly and a human repoints this value. The
#                           internal name above stays put.
#
#     apiId:                A GUARD, NOT AN IDENTITY KEY. See the warning below
#                           before using this for anything. Recorded so a fetch
#                           can detect that a slug has started serving a
#                           different API.
#
#     status: frozen        Optional. Omit it and the spec is active: it must
#                           fetch and validate, and a failure fails the run.
#                           `frozen` means the committed specs/raw/<name>.yaml
#                           is deliberately being kept and not refreshed. A
#                           frozen spec is still fetched every run so the log
#                           can report whether the freeze could now be lifted,
#                           but its file is never written and it never fails
#                           the run.
#
#     reason:               Required when frozen. Why, in enough detail that
#                           someone can decide whether to lift it.
#
#     since:                Required when frozen. The date the spec stopped
#                           being refreshed, derived from evidence (git history
#                           of specs/raw/summary.json, a portal change), not
#                           from when the freeze was written down.
#
# ---------------------------------------------------------------------------
# WARNING: apiId is neither unique per API nor stable over time.
#          Do not resolve slugs with it.
# ---------------------------------------------------------------------------
#
# Every document the portal returns carries an `api_id`, and it is tempting to
# treat it as a stable identity that survives slug renames. It is not one, and
# both halves of that have now been observed upstream.
#
# NOT UNIQUE. Measured 2026-08-13:
#
#   /devDoc/apiDetails/products                api_id 5cedab22-e2f6-4d23-b5c5-9cc8b6b86122
#                                              "Operations Center - Products", 8 documents
#   /devDoc/apiDetails/service-data-products   api_id 5cedab22-e2f6-4d23-b5c5-9cc8b6b86122
#                                              "Service Data Product - POPS", 1 document
#
# Two unrelated APIs, one id. The portal's own catalog mapped that id to
# service-data-products, so resolving `products` by api_id would have silently
# overwritten specs/raw/products.yaml with a different API's contract under the
# same filename: right name, wrong content, no error.
#
# NOT STABLE. Measured 2026-08-18, between the 08-17 and 08-18 syncs:
#
#   /devDoc/apiDetails/products                api_id 8c97edbb-506b-4a2b-aef8-34f114ed0ea8
#                                              "Operations Center - Products", 8 documents
#   /devDoc/apiDetails/service-data-products   api_id 5cedab22-e2f6-4d23-b5c5-9cc8b6b86122
#                                              unchanged
#
# Deere gave products its own id and the collision above is gone. Same API
# either way: the 8 documents carry the same end_point_name values, and the
# live spec and the committed one both declare exactly 38 operations with no
# difference in either direction. The id moved under a contract that did not.
#
# So: the slug is the identity, and a rename is a human decision. apiId is only
# ever compared against what a fetch returns. A mismatch proves the slug is
# serving something the registry has not seen before, which may be a different
# API or the same one reissued; it does not say which, so it stops the run and
# asks. A match proves nothing.
#
# ---------------------------------------------------------------------------

