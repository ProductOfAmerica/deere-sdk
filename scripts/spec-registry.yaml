  notifications:
    slug: notifications
    status: frozen
    since: 2026-05-23
    reason: >-
      HELD OVER A DROPPED OPERATION, NOT OVER FETCHABILITY. This document
      fetches and validates cleanly today, so the health report will say so
      every run; that is a fact about the fetch, not a reason to unfreeze.

      Deere edited this document on 2026-07-14 and it no longer declares
      DELETE /notificationEvents/{sourceEvent}, which scripts/api-surface.yaml
      still pins to NotificationsApi.delete. Unfreezing pulls in the current
      3-operation document, classifies the run breaking, and drops a published
      method. Deere announced no retirement, their practice is an ACTION
      REQUIRED notice with six to eight months of warning, and the API is still
      marked active, so the endpoint is believed live and the doc merely tidied.
      Lifting this freeze needs that confirmed with Deere support first;
      dropping the method is a major-version decision.

      The ORIGINAL cause, now fixed, is why `since` is 2026-05-23 rather than
      the date of Deere's edit: the portal serves a top-level `swagger: 3.0.0`
      key where isOpenApiDocument required `openapi`, even though
      scripts/fix-specs.ts had rewritten that exact key one stage later for
      years. That validator landed 2026-05-22 in #21 and the next sync began
      rejecting this spec (specs/raw/summary.json history shows notFound going
      from [] on 2026-05-22 to ["notifications"] on 2026-05-23). Self-inflicted,
      and unnoticed for three months.

  operators:
    slug: operators

  organizations:
    slug: organizations

  partnerships:
    slug: partnerships
    status: frozen
    since: 2026-08-22
    reason: >-
      HELD OVER A DROPPED OPERATION, NOT OVER FETCHABILITY. Same shape as the
      notifications freeze: the document fetches cleanly, but adopting it would
      drop a published method whose route still works.

      Between the 2026-08-21 and 2026-08-22 syncs Deere's document stopped
      declaring POST /partnerships/{token}/permissions, which
      scripts/api-surface.yaml pins to PartnershipsApi.createPermissions, and
      gained PUT /organizations/{orgId}/partnerPermissions. Measured 2026-08-22
      with controls validating the 401/404 discriminator in the same runs: the
      dropped route still answers 401 (exists) on /platform in api and
      sandboxapi, and the new route is not a rename of it: different verb,
      keyed by orgId instead of partnership token, different body, and it
      answers 401 on /isg in all four environments while returning 404 on
      /platform, the base its own document declares. Their migration is
      half-done: the doc describes the destination, the gateway is in between.

      Lifting this freeze is triggered by probe-routes going red on the old
      route (it fails the run on a deterministic 404 with valid controls), or
      by a Deere retirement notice. Either way the lift is one deliberate
      change: adopt the current document, delete the createPermissions manifest
      entry (major version), add a routing-overrides path entry putting
      /organizations/{orgId}/partnerPermissions on /isg with the measurement
      above as evidence, and ship the successor method.

  products:
    slug: products

  users:
    slug: users

  webhook:
    slug: webhook
