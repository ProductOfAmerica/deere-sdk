openapi: "3.0.1"
info:
  title: "Users API"
  description: "This endpoint returns information about the user, such as first and last name, the account name, etc. This call can be used by a logged-in user to view their own information."
  version: "1.0.0"
servers:
  - url: "https://{environment}.deere.com/platform"
    variables:
      environment:
        default: "api"
        enum:
          - "api"
          - "apicert"
          - "apiqa.tal"
          - "sandboxapi"
          - "partnerapi"
paths:
  /users/@currentUser:
    get:
      summary: "View User Info Using Literal Value"
      description: "This endpoint returns information about the user, such as first and last name, the account name, etc. This call can be used by a logged-in user to view their own information.<br/> The response also contains links to the following resources: <ul><li><b>organizations:</b> View a list of organizations to which the user belongs.</li> <li><b>files:</b> View a list of files belonging to the user.</li></ul>"
      parameters:
        - name: "@currentUser"
          in: "path"
          description: "Use literal value \"@currentUser\" to retrieve the currently authenticated user information."
          required: true
          schema:
            type: "string"
            default: "@currentUser"
            example: "@currentUser"
        - name: "embed"
          in: "query"
          description: "Add user's staff organizations and available links to response."
          required: false
          schema:
            type: "string"
            default: "N/A"
            example: "Organizations"
      responses:
        "200":
          description: "The users."
          content:
            application/vnd.deere.axiom.v3+json:
              schema:
                type: "object"
                properties:
                  links:
                    items:
                      $ref: "#/components/schemas/UsersLink"
                  values:
                    items:
                      $ref: "#/components/schemas/UsersValue"
              examples:
                No Header:
                  description: "200 OK<br/> Content-Type:application/vnd.deere.axiom.v3+jso"
                  value:
                    "@type": "User"
                    accountName: "johndoe"
                    givenName: "John"
                    familyName: "Doe"
                    userType: "Customer"
                    links:
                      - "@type": "Link"
                        rel: "self"
                        uri: " https://sandboxapi.deere.com/platform/users/johndoe"
                        followable: true
                      - "@type": "Link"
                        rel: "organizations"
                        uri: " https://sandboxapi.deere.com/platform/users/johndoe/organizations"
                        followable: true
  /users/{userName}/organizations:
    get:
      summary: "View User Orgs"
      description: "This request will return a list of organizations. The response will ONLY contain organizations in which the user is a staff member (member=true). This response will NOT contain partner organizations in which the user is not a staff member (member=false)."
      parameters:
        - $ref: "#/components/parameters/UserName2"
        - $ref: "#/components/parameters/X-deere-signature2"
      responses:
        "200":
          description: "View Organization List"
          content:
            application/vnd.deere.axiom.v3+json:
              schema:
                properties:
                  links:
                    items:
                      $ref: "#/components/schemas/OrganizationLink2"
                  values:
                    items:
                      $ref: "#/components/schemas/OrganizationViewGet"
              examples:
                No Header:
                  description: "200 OK <br/>Content-Type: application/vnd.deere.axiom.v3+json <br/>x-deere-signature: 3b5392015e4b4e1c92013026f47109bb"
                  value:
                    links:
                      - rel: "self"
                        uri: "https://sandboxapi.deere.com/platform/users/johndoe/organizations"
                    total: 2
                    values:
                      - "@type": "Organization"
                        name: "A First Org Name (Is Enabled)"
                        type: "customer"
                        member: true
                        internal: false
                        id: "1234"
                        links:
                          - rel: "self"
                            uri: "https://sandboxapi.deere.com/platform/organizations/1234"
                          - rel: "manage_connections"
                            uri: "https://connections.deere.com/connections/28efb3cb-cbd5-4888-8570-99465ea8860e/connections-dialog?orgId=1234"
                      - "@type": "Organization"
                        name: "A Second Org Name (Not Enabled)"
                        type: "customer"
                        member: true
                        internal: false
                        id: "4321"
                        links:
                          - rel: "self"
                            uri: "https://sandboxapi.deere.com/platform/organizations/4321"
                          - rel: "connections"
                            uri: "https://connections.deere.com/connections/28efb3cb-cbd5-4888-8570-99465ea8860e/organizations"
  /users/{username}:
    get:
      summary: "View User Info"
      description: "This endpoint returns information about the user, such as first and last name, the account name, etc. This call can be used by a logged-in user to view their own information.<br/> The response also contains links to the following resources: <ul><li><b>organizations:</b> View a list of organizations to which the user belongs.</li> <li><b>files:</b> View a list of files belonging to the user.</li></ul>"
      parameters:
        - name: "username"
          in: "path"
          description: "Filter by username."
          required: true
          schema:
            type: "string"
            default: "N/A"
            example: "JohnDoe"
        - name: "embed"
          in: "query"
          description: "Add user's staff organizations and available links to response."
          required: false
          schema:
            type: "string"
            default: "N/A"
            example: "Organizations"
      responses:
        "200":
          description: "The users."
          content:
            application/vnd.deere.axiom.v3+json:
              schema:
                type: "object"
                properties:
                  links:
                    items:
                      $ref: "#/components/schemas/UsersLink"
                  values:
                    items:
                      $ref: "#/components/schemas/UsersValue"
              examples:
                No Header:
                  description: "200 OK<br/> Content-Type:application/vnd.deere.axiom.v3+jso"
                  value:
                    "@type": "User"
                    accountName: "johndoe"
                    givenName: "John"
                    familyName: "Doe"
                    userType: "Customer"
                    links:
                      - "@type": "Link"
                        rel: "self"
                        uri: " https://sandboxapi.deere.com/platform/users/johndoe"
                        followable: true
                      - "@type": "Link"
                        rel: "organizations"
                        uri: " https://sandboxapi.deere.com/platform/users/johndoe/organizations"
                        followable: true
components:
  parameters:
    OrgId:
      in: "query"
      name: "orgId"
      description: "Returns the name of the organization that corresponds with the given organization ID."
      required: false
      schema:
        type: "string"
        example: 2101
    OrgIdGet:
      in: "path"
      name: "orgId"
      description: "Organization"
      required: true
      schema:
        type: "string"
        example: 734561
    OrgName:
      in: "query"
      name: "orgName"
      description: "Returns a list of organizations that contain the given string in their name."
      required: false
      schema:
        type: "string"
        example: "Smith Farms"
    UserName:
      in: "query"
      name: "userName"
      description: "Returns a list of organizations of which a particular user is a member."
      required: false
      schema:
        type: "string"
        example: "JohnDoe"
    UserName2:
      in: "path"
      name: "userName"
      description: "User Name."
      required: true
      schema:
        type: "string"
        example: "JohnDoe"
    X-deere-signature:
      in: "header"
      name: "x-deere-signature"
      description: "x-deere-signature should be managed by the client per user per API. For a new user/new API, the first request will have a blank value for x-deere-signature. Changes can be tracked with the x-deere-signature returned in the response. If the response has not changed since the last API call, the value of x-deere-signature is not changed and the client should use the same String Token next time."
      required: false
      schema:
        type: "string"
        example: "7r5392615e4b4e1c92018026f47109bb"
    X-deere-signature2:
      in: "header"
      name: "x-deere-signature"
      description: "x-deere-signature should be managed by the client per user per API. For a new user/new API, the first request will have a blank value for x-deere-signature. Changes can be tracked with the x-deere-signature returned in the response. If the response has not changed since the last API call, the value of x-deere-signature is not changed and the client should use the same String Token next time."
      required: false
      schema:
        type: "string"
        example: "4r5392615e4b4e1c92018026f47109bb"
  schemas:
    Organization:
      properties:
        x-deere-signature:
          type: "string"
          example: "3b5392015e4b4e1c92013026f47109bb"
          description: "A new x-deere-signature response header will be included if the response has changed since last api call."
        id:
          type: "string"
          description: "The organization ID."
          example: 1234
        name:
          type: "string"
          description: "The organization name."
          example: "Smith Farms"
        type:
          type: "string"
          description: "The organization type: customer or dealer."
          example: "customer"
        member:
          type: "boolean"
          example: "true"
          description: "TRUE means that the user is a member of the org."
    OrganizationLink:
      properties:
        self:
          example: "https://sandboxapi.deere.com/platform/organizations/1234"
          description: "Link to organization"
        connections:
          example: "https://connections.deere.com/connections/28efb3cb-cbd5-4888-8570-99465ea8860e/select-organizations"
          description: "Redirect link to enable organization access"
        manage_connections:
          example: "https://connections.deere.com/connections/28efb3cb-cbd5-4888-8570-99465ea8860e/connections-dialog?orgId=1234"
          description: "Redirect link to manage organization access and permissions"
    OrganizationLink2:
      properties:
        self:
          example: "https://sandboxapi.deere.com/platform/organizations/1234"
          description: "Link to organization"
        connections:
          example: "https://connections.deere.com/connections/28efb3cb-cbd5-4888-8570-99465ea8860e/organizations"
          description: "Redirect link to enable organization access"
        manage_connections:
          example: "https://connections.deere.com/connections/28efb3cb-cbd5-4888-8570-99465ea8860e/connections-dialog?orgId=1234"
          description: "Redirect link to manage organization access and permissions"
    OrganizationView:
      properties:
        id:
          type: "string"
          description: "The organization ID."
          example: 1234
        name:
          type: "string"
          description: "The organization name."
          example: "Smith Farms"
        type:
          type: "string"
          description: "The organization type: customer or dealer."
          example: "customer"
        member:
          type: "boolean"
          example: "true"
          description: "TRUE means that the user is a member of the org."
    OrganizationViewGet:
      properties:
        x-deere-signature:
          type: "string"
          example: "3b5392015e4b4e1c92013026f47109bb"
          description: "A new x-deere-signature response header will be included if the response has changed since last api call."
        id:
          type: "string"
          description: "Organization ID."
          example: 1234
        name:
          type: "string"
          description: "Organization name."
          example: "Smith Farms"
        type:
          type: "string"
          description: "Organization type."
          example: "customer"
        partnerships:
          example: "Apple Farms"
          type: "string"
          description: "Partners of this organization."
        member:
          type: "boolean"
          example: "true"
          description: "Indicates whether the user is a member of the organization."
    UsersLink:
      properties:
        organizations:
          example: "https://sandboxapi.deere.com/platform/users/johndoe/organizations"
          description: "Organizations Link."
    UsersValue:
      properties:
        accountName:
          type: "string"
          example: "JohnDoe"
          description: "User's account name."
        givenName:
          type: "string"
          example: "John"
          description: "User's first name."
        familyName:
          type: "string"
          example: "Doe"
          description: "User's last name."
        userType:
          type: "string"
          example: "Customer"
          description: "User's type. Examples are customer, dealer, internal"
