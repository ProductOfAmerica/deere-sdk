onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

# One day, in minutes: the default in pnpm 11 and 12, which Dependabot runs. Without
# it a local pnpm 10 relock can lock a release Dependabot's pnpm rejects. For a
# same-day fix, list the package under minimumReleaseAgeExclude.
minimumReleaseAge: 1440
