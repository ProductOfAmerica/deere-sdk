onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

# Security pins on transitive dev dependencies (this package ships no runtime
# dependencies). Kept here, not under "pnpm" in package.json: pnpm 11 no longer
# reads that field, and Dependabot runs pnpm 11, so overrides there were dropped
# from every lockfile it wrote.
#   brace-expansion: GHSA-3jxr-9vmj-r5cp and GHSA-q2hr-2g5m-vwhr, fixed in 5.0.12.
overrides:
  brace-expansion: 5.0.12
  minimatch: ^10.2.3
